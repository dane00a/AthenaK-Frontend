# Install once per clone: `make hooks`
# Then every `git commit` runs these checks; a failure blocks the commit.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|tsx|css|json)$
        additional_dependencies:
          - prettier@3.3.2

  - repo: local
    hooks:
      - id: frontend-tsc
        name: frontend tsc --noEmit
        entry: bash -c 'cd frontend && pnpm -s tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$
