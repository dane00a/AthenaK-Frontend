id: blast
name: 2D blast wave
description: Centered high-pressure spot in a cold ambient medium; strong expanding shock.
physics_module: hydro
wizard_state:
  physics_module: hydro
  initial_condition: blast
  emit_par_for_loop: true
  call_prim_to_cons: true
inputs:
  - filename: blast.athinput
    content: |
      <comment>
      problem = 2D blast wave

      <job>
      basename = blast

      <mesh>
      nghost = 2
      nx1    = 128
      x1min  = -0.5
      x1max  = 0.5
      ix1_bc = outflow
      ox1_bc = outflow
      nx2    = 128
      x2min  = -0.5
      x2max  = 0.5
      ix2_bc = outflow
      ox2_bc = outflow
      nx3    = 1

      <time>
      integrator  = rk2
      cfl_number  = 0.4
      tlim        = 0.2

      <hydro>
      eos         = ideal
      gamma       = 1.4
      reconstruct = plm
      rsolver     = hllc

      <output1>
      file_type = hst
      dt        = 0.01

      <output2>
      file_type = bin
      dt        = 0.02
      variable  = hydro_w
