[project]
name = "athenak-frontend-backend"
version = "0.1.0"
description = "FastAPI backend for AthenaK-Frontend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "celery>=5.4",
    "redis>=5.0",
    "jinja2>=3.1",
    "filelock>=3.15",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "numpy>=1.26",
    "h5py>=3.11",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "types-redis>=4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
# B008: FastAPI's Depends()/Body()/Query() idiomatically live in defaults.
# PLR0913: function argument count limit is too aggressive for route handlers.
ignore = ["B008", "PLR0913", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]          # "magic values" are fine in assertions
"alembic/versions/*" = ["E501"]  # autogenerated migrations

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
